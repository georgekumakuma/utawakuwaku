<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f14">
  <meta name="description" content="YouTube動画の区間を「曲」として登録し、プレイリストで連続再生する歌枠プレイヤー">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="utawakuwaku">
  <title>utawakuwaku 〜うたわくわく！〜</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-mark">♪</div>
    <div class="splash-name">utawakuwaku</div>
  </div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="ナビゲーション"></aside>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    <main class="main" id="main">
      <header class="topbar" id="topbar"></header>
      <div class="player-banner" id="player-banner" style="display:none" role="alert"></div>
      <section class="stage" id="stage" aria-label="再生中"></section>
      <section class="content" id="content" aria-label="曲リスト"></section>
    </main>

    <aside class="panel" id="panel" aria-label="編集パネル"></aside>

    <footer class="playerbar" id="playerbar" aria-label="プレイヤー"></footer>
  </div>

  <noscript><div style="padding:40px;font-family:sans-serif">このアプリには JavaScript が必要です。</div></noscript>
  <script>
    document.getElementById('drawer-backdrop').addEventListener('click', function () { document.body.classList.remove('drawer-open'); });
  </script>
  <script type="module" src="./src/app/app.js"></script>
</body>
</html>
